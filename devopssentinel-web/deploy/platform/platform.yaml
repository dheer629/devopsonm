# DevOpsSentinel Web -- platform fixtures.
#
# Applied by scripts/platform-resources.sh (namespace supplied on the command line).
# Everything carries `devopssentinel.io/platform: "true"` for one-command cleanup.
# Images are pinned to what is already present in the local cluster.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
  labels:
    devopssentinel.io/platform: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-cache
  labels:
    devopssentinel.io/platform: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-web
  labels:
    app: platform-web
    devopssentinel.io/platform: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-web
  template:
    metadata:
      labels:
        app: platform-web
        devopssentinel.io/platform: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-data
        - name: cache
          persistentVolumeClaim:
            claimName: platform-cache
---
apiVersion: v1
kind: Service
metadata:
  name: platform-web
  labels:
    app: platform-web
    devopssentinel.io/platform: "true"
spec:
  type: ClusterIP
  selector:
    app: platform-web
  ports:
    - name: http
      port: 9898
      targetPort: 9898
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-postgres
  labels:
    devopssentinel.io/platform: "true"
type: Opaque
stringData:
  password: platform-not-a-real-credential
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-postgres-data
  labels:
    devopssentinel.io/platform: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-postgres
  labels:
    app: platform-postgres
    devopssentinel.io/platform: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-postgres
  template:
    metadata:
      labels:
        app: platform-postgres
        devopssentinel.io/platform: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: platform
            - name: POSTGRES_USER
              value: platform
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-postgres
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "platform"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1000m"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # Without this the seeded schema would vanish on every pod restart,
        # which is exactly what made the SQL console look empty.
        - name: data
          persistentVolumeClaim:
            claimName: platform-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: platform-postgres
    devopssentinel.io/platform: "true"
spec:
  type: ClusterIP
  selector:
    app: platform-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-kafka-data
  labels:
    devopssentinel.io/platform: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# Kafka discovery reads Service metadata, and the opt-in Topics view needs a
# real broker. This is a single-node KRaft broker (the same shape the
# devopssentinel-e2e harness uses). `advertised.listeners` is rendered by
# scripts/platform-resources.sh with the cluster node IP so both in-cluster and
# NodePort clients can reach it. Logs live on a PVC so topics and offsets
# survive a pod or cluster restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-kafka-config
  labels:
    devopssentinel.io/platform: "true"
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@127.0.0.1:9093
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://__NODE_IP__:30092
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    controller.listener.names=CONTROLLER
    log.dirs=/var/lib/kafka/data
    num.partitions=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    group.initial.rebalance.delay.ms=0
    auto.create.topics.enable=false
    num.network.threads=2
    num.io.threads=2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-kafka
  labels:
    app: platform-kafka
    devopssentinel.io/platform: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: platform-kafka
  template:
    metadata:
      labels:
        app: platform-kafka
        devopssentinel.io/platform: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - |
              # Format the KRaft storage directory ONCE. Re-running `format`
              # with a fresh random cluster id fails verification against the
              # existing meta.properties (and would drop every topic), so with a
              # PersistentVolume we must reuse whatever is already there.
              if [ ! -f /var/lib/kafka/data/meta.properties ]; then
                echo "platform-kafka: formatting a new KRaft storage directory"
                /opt/kafka/bin/kafka-storage.sh format \
                  -t "$(/opt/kafka/bin/kafka-storage.sh random-uuid)" \
                  -c /fixture/server.properties
              else
                echo "platform-kafka: reusing the existing KRaft storage directory"
              fi
              exec /opt/kafka/bin/kafka-server-start.sh /fixture/server.properties
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1536Mi
          volumeMounts:
            - name: config
              mountPath: /fixture
              readOnly: true
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: config
          configMap:
            name: platform-kafka-config
        - name: data
          persistentVolumeClaim:
            claimName: platform-kafka-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: platform-kafka
    devopssentinel.io/platform: "true"
spec:
  type: ClusterIP
  selector:
    app: platform-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
# NodePorts so the local adapter (and the engine console) can reach the platform
# data services from WSL. 30432 -> PostgreSQL, 30092 -> Kafka.
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  labels:
    app: platform-postgres
    devopssentinel.io/platform: "true"
spec:
  type: NodePort
  selector:
    app: platform-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-nodeport
  labels:
    app: platform-kafka
    devopssentinel.io/platform: "true"
spec:
  type: NodePort
  selector:
    app: platform-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      nodePort: 30092
