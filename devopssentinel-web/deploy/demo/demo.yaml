# DevOpsSentinel Web -- demo fixtures.
#
# Applied by scripts/demo-resources.sh (namespace supplied on the command line).
# Everything carries `devopssentinel.io/demo: "true"` for one-command cleanup.
# Images are pinned to what is already present in the demo vcluster.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-data
  labels:
    devopssentinel.io/demo: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-cache
  labels:
    devopssentinel.io/demo: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  labels:
    app: demo-web
    devopssentinel.io/demo: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
        devopssentinel.io/demo: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9898
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9898
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-data
        - name: cache
          persistentVolumeClaim:
            claimName: demo-cache
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  labels:
    app: demo-web
    devopssentinel.io/demo: "true"
spec:
  type: ClusterIP
  selector:
    app: demo-web
  ports:
    - name: http
      port: 9898
      targetPort: 9898
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-postgres
  labels:
    devopssentinel.io/demo: "true"
type: Opaque
stringData:
  password: demo-not-a-real-credential
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-postgres
  labels:
    app: demo-postgres
    devopssentinel.io/demo: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-postgres
  template:
    metadata:
      labels:
        app: demo-postgres
        devopssentinel.io/demo: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: demo
            - name: POSTGRES_USER
              value: demo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-postgres
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "demo"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: demo-postgres
    devopssentinel.io/demo: "true"
spec:
  type: ClusterIP
  selector:
    app: demo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# Kafka discovery reads Service metadata, and the opt-in Topics view needs a
# real broker. This is a single-node KRaft broker (the same shape the
# devopssentinel-e2e harness uses). `advertised.listeners` is rendered by
# scripts/demo-resources.sh with the cluster node IP so both in-cluster and
# NodePort clients can reach it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-kafka-config
  labels:
    devopssentinel.io/demo: "true"
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@127.0.0.1:9093
    listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
    advertised.listeners=PLAINTEXT://__NODE_IP__:30092
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    controller.listener.names=CONTROLLER
    log.dirs=/var/lib/kafka/data
    num.partitions=1
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    group.initial.rebalance.delay.ms=0
    auto.create.topics.enable=false
    num.network.threads=2
    num.io.threads=2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-kafka
  labels:
    app: demo-kafka
    devopssentinel.io/demo: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-kafka
  template:
    metadata:
      labels:
        app: demo-kafka
        devopssentinel.io/demo: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
            - >-
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted
              -t "$(/opt/kafka/bin/kafka-storage.sh random-uuid)"
              -c /fixture/server.properties;
              exec /opt/kafka/bin/kafka-server-start.sh /fixture/server.properties
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1536Mi
          volumeMounts:
            - name: config
              mountPath: /fixture
              readOnly: true
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: config
          configMap:
            name: demo-kafka-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app: demo-kafka
    devopssentinel.io/demo: "true"
spec:
  type: ClusterIP
  selector:
    app: demo-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
# NodePorts so the local adapter (and the engine console) can reach the demo
# data services from WSL. 30432 -> PostgreSQL, 30092 -> Kafka.
apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  labels:
    app: demo-postgres
    devopssentinel.io/demo: "true"
spec:
  type: NodePort
  selector:
    app: demo-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-nodeport
  labels:
    app: demo-kafka
    devopssentinel.io/demo: "true"
spec:
  type: NodePort
  selector:
    app: demo-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
      nodePort: 30092
