[project]
name = "devopssentinel-web"
version = "1.0.0"
description = "Local read-only Kubernetes / GitOps / PKI / ETDP operations control center (browser edition of DevOpsSentinel)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
