apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: devopsonm
  namespace: flux-system
spec:
  interval: 1m
  timeout: 60s
  url: https://github.com/dheer629/devopsonm.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devopsonm
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  path: ./deploy/local
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: devopsonm
